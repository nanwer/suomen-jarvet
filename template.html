<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Suomen järvet — live</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--accent:#f59e0b;--card:rgba(17,22,34,.9);--bd:rgba(120,140,180,.18);--muted:#96a2ba;--faint:#69768f}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:#e8eefc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
#map{position:absolute;inset:0;background:#eef2f6}.maplibregl-ctrl-attrib{font-size:10px}
.hud{position:absolute;z-index:5}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 30px rgba(0,20,40,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.title{top:18px;left:18px;padding:14px 17px;max-width:314px}
.kick{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#37d67a;box-shadow:0 0 9px #37d67a}
.title h1{margin:6px 0 4px;font-size:22px;font-weight:600}.title h1 b{color:var(--accent)}
.title p{margin:0;font-size:12px;line-height:1.55;color:var(--muted)}.title p b{color:#cdd7ea;font-weight:600}
.search{top:18px;left:50%;transform:translateX(-50%);width:340px}
.search input{width:100%;padding:11px 15px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:#fff;font-size:14px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,20,40,.25);outline:none}
.search input::placeholder{color:var(--faint)}
.results{margin-top:6px;border-radius:12px;overflow:hidden;max-height:330px;overflow-y:auto;display:none}
.results.on{display:block}.res{padding:9px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.res:hover{background:rgba(245,158,11,.16)}.res .m{font-size:11px;color:var(--faint)}
.topr{top:18px;right:18px;display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:99px;overflow:hidden;box-shadow:0 8px 30px rgba(0,20,40,.25)}
.lang span{padding:6px 12px;font-size:11px;cursor:pointer;color:var(--muted)}.lang span.on{background:var(--accent);color:#111}
.real{font-size:10px;letter-spacing:.1em;background:rgba(11,26,18,.85);border:1px solid rgba(55,214,122,.35);padding:6px 10px;border-radius:99px;white-space:nowrap;color:#37d67a}
.lens{top:66px;right:18px;padding:8px;width:224px}
.lens .lab{font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;padding:4px 6px 6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.03);cursor:pointer;margin-bottom:5px}
.opt:hover{background:rgba(255,255,255,.07)}.opt.on{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.12)}
.opt .sw{width:20px;height:20px;border-radius:6px;flex:0 0 auto;opacity:.4}.opt.on .sw{opacity:1}
.opt .nm{font-size:12.5px}.opt .sub{font-size:10px;color:var(--faint);margin-top:1px}
.opt .ck{margin-left:auto;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--faint);flex:0 0 auto}.opt.on .ck{background:var(--accent);border-color:var(--accent)}
.legend{left:18px;bottom:20px;padding:12px 14px;width:266px}.lgblock{margin-bottom:10px}.lgblock:last-child{margin-bottom:0}
.lt{font-size:11.5px;color:#e8eefc;margin-bottom:7px;font-weight:500}
.bar{height:9px;border-radius:5px;margin-bottom:5px}.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.lgnote{margin-top:6px;font-size:10px;color:var(--faint);line-height:1.4}
#panel{right:18px;bottom:20px;width:262px;padding:15px 16px;display:none}
#panel h3{margin:0 0 2px;font-size:16px;font-weight:600}#panel .k{font-size:11px;color:var(--muted);margin-bottom:9px}
.badge{display:inline-block;font-size:9.5px;padding:2px 7px;border-radius:99px;margin-bottom:8px;font-weight:500}
.badge.c{background:rgba(55,214,122,.16);color:#4ade80}.badge.a{background:rgba(148,163,184,.2);color:#cbd5e1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-bottom:6px}
.grid .c .v{font-size:14px;color:#fff;font-weight:600}.grid .c .l{color:var(--faint);font-size:10px}
.ws{font-size:11px;color:var(--muted);margin-bottom:3px}.ws b{color:#cdd7ea;font-weight:500}
.town{font-size:11px;color:var(--muted);margin:3px 0 2px}.town b{color:#cdd7ea;font-weight:500}
.big{font-size:13px;margin:2px 0 3px;color:#cdd7ea}.big b{color:#fff}
.cap{font-size:10px;color:var(--faint);margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;border-radius:9px;font-size:12.5px;font-weight:500;text-decoration:none;margin-top:7px;cursor:pointer;border:1px solid var(--bd)}
.btn.g{background:var(--accent);color:#111;border-color:var(--accent)}.btn.o{background:rgba(255,255,255,.06);color:#cdd7ea}
#panel .x{position:absolute;top:10px;right:12px;color:var(--faint);cursor:pointer;font-size:16px}
</style></head><body>
<div id="map"></div>
<div class="hud card title"><div class="kick"><span class="dot"></span> <span id="kick"></span></div>
<h1>Suomen <b>järvet</b></h1><p id="sub"></p></div>
<div class="hud search"><input id="q" autocomplete="off"><div class="results card" id="res"></div></div>
<div class="hud topr"><div class="lang"><span data-lang="fi" class="on">FI</span><span data-lang="en">EN</span></div><div class="real" id="real"></div></div>
<div class="hud card lens" id="lens"><div class="lab" id="lensLab"></div>
<div class="opt on" data-l="level"><span class="sw" style="background:linear-gradient(90deg,#d97706,#64748b,#2563eb)"></span><div><div class="nm" id="nm-level"></div><div class="sub" id="sub-level"></div></div><span class="ck"></span></div>
<div class="opt" data-l="temp"><span class="sw" style="background:linear-gradient(90deg,#2563eb,#14b8a6,#f59e0b,#ef4444)"></span><div><div class="nm" id="nm-temp"></div><div class="sub" id="sub-temp"></div></div><span class="ck"></span></div>
<div class="opt" data-l="ice"><span class="sw" style="background:linear-gradient(90deg,#f59e0b,#14b8a6,#2563eb)"></span><div><div class="nm" id="nm-ice"></div><div class="sub" id="sub-ice"></div></div><span class="ck"></span></div>
<div class="opt on" data-l="lakes"><span class="sw" style="background:#1e4b7a"></span><div><div class="nm" id="nm-lakes"></div><div class="sub" id="sub-lakes"></div></div><span class="ck"></span></div></div>
<div class="hud card legend" id="legend"></div>
<div class="hud card" id="panel"><span class="x" onclick="hidePanel()">✕</span>
<h3 id="pName">—</h3><div class="k" id="pKunta"></div><div id="pBig"></div><div class="grid" id="pGrid"></div><div class="ws" id="pWs"></div><div class="town" id="pTown"></div>
<a class="btn g" id="pDir" target="_blank" rel="noopener"></a><a class="btn o" id="pOsm" target="_blank" rel="noopener"></a></div>
<script>
const CFG=__CFG__;const P=CFG.p90,tmin=CFG.tmin,tmax=CFG.tmax,tmid=(tmin+tmax)/2,imin=CFG.imin,imax=CFG.imax,TOWNS=CFG.towns;
const NF=n=>n.toLocaleString('fi-FI');
const S={fi:{kick:'Elävät vedet · Suomi · live',
 sub:'Tuhansien järvien maa — oikeasti <b>~188 000</b>. Tässä ne <b>'+NF(CFG.nlake)+'</b> kyllin suurta saadakseen nimen. Hae, lue, saat reittiohjeet.',
 search:'Hae järveä — esim. Saimaa, Inari, Näsijärvi',live:'● Oikeaa dataa — SYKE + Järviwiki',layers:'Tasot (yhdistele vapaasti)',
 level:'Vedenkorkeus',temp:'Lämpötila',ice:'Jäänlähtö ’26',lakes:'Nimetyt järvet',
 levelSub:NF(CFG.nlevel)+' mittaria · 14 vrk',tempSub:'~'+CFG.ntemp+' paikkaa · Järviwiki',iceSub:CFG.nice+' asemaa · kevät 2026',lakesSub:NF(CFG.nlake)+' · rekisteri ≥1 ha',
 legLevel:'Vedenkorkeus · 14 vrk muutos ('+CFG.ldate+')',legTemp:'Pintaveden lämpötila · viim. 7 vrk',legIce:'Jäänlähtö · kevät 2026',
 loFall:'−'+P+' cm (laskee)',hiRise:'+'+P+' cm (nousee)',lnLevel:NF(CFG.nlevel)+' mittaria · sininen nousee, oranssi laskee.',
 lnTemp:CFG.ntemp+' havaintopaikkaa · uimarien ja viranomaisten mittaamaa (CC BY 4.0).',lnIce:CFG.nice+' asemaa raportoi jäänlähdön. Aikaisin '+CFG.iloD+', myöhäisin '+CFG.ihiD+'.',
 iceEarly:'aikaisin ('+CFG.iloD+')',iceLate:'myöhäisin ('+CFG.ihiD+')',
 noSel:'Kartalla <b>'+NF(CFG.nlake)+'</b> rekisterijärveä (≥1 ha). Pienemmät lammet (~188 000 kaikkiaan) näkyvät pohjakartalla.',
 dir:'➜ Reittiohjeet',osm:'Avaa OpenStreetMapissa',mLevel:'Vedenkorkeus',in14:'/ 14 vrk',mTemp:'Pintavesi',mIce:'Jää lähti',
 area:'pinta-ala',dmax:'suurin syvyys',dmean:'keskisyvyys',sh:'rantaviiva',vol:'tilavuus',ws:'Vesistöalue',town:'lähin taajama',
 lvlHist:'cm',tHist:'°C',noData:'Ei live-mittausta — järvi silti mukana.',citizen:'uimarihavainto',authority:'viranomaisasema'},
 en:{kick:'Living waters · Finland · live',
 sub:'The land of a thousand lakes — really <b>~188,000</b>. Here are the <b>'+NF(CFG.nlake)+'</b> big enough to earn a name. Search, read, get directions.',
 search:'Search a lake — e.g. Saimaa, Inari, Näsijärvi',live:'● Real data — SYKE + Järviwiki',layers:'Layers (mix freely)',
 level:'Water level',temp:'Temperature',ice:'Ice-out ’26',lakes:'Named lakes',
 levelSub:NF(CFG.nlevel)+' gauges · 14-day',tempSub:'~'+CFG.ntemp+' sites · Järviwiki',iceSub:CFG.nice+' stations · spring 2026',lakesSub:NF(CFG.nlake)+' · register ≥1 ha',
 legLevel:'Water level · 14-day change ('+CFG.ldate+')',legTemp:'Surface temperature · last 7 days',legIce:'Ice break-up · spring 2026',
 loFall:'−'+P+' cm (falling)',hiRise:'+'+P+' cm (rising)',lnLevel:NF(CFG.nlevel)+' gauges · blue rising, amber falling.',
 lnTemp:CFG.ntemp+' sites · measured by swimmers & authorities (CC BY 4.0).',lnIce:CFG.nice+' stations logged ice-out. Earliest '+CFG.iloD+', latest '+CFG.ihiD+'.',
 iceEarly:'earlier ('+CFG.iloD+')',iceLate:'later ('+CFG.ihiD+')',
 noSel:'Showing <b>'+NF(CFG.nlake)+'</b> register lakes (≥1 ha). Smaller ponds (~188,000 total) live on the basemap.',
 dir:'➜ Get directions',osm:'Open in OpenStreetMap',mLevel:'Water level',in14:'/ 14 days',mTemp:'Surface',mIce:'Ice went out',
 area:'area',dmax:'max depth',dmean:'mean depth',sh:'shoreline',vol:'volume',ws:'Watershed',town:'nearest town',
 lvlHist:'cm',tHist:'°C',noData:'No live measurement — still a lake.',citizen:'citizen reading',authority:'authority station'}};
let LANG='fi';const vis={level:true,temp:false,ice:false,lakes:true};let LAKES=[],lastF=null;
const map=new maplibregl.Map({container:'map',center:[25.7,64.4],zoom:4.55,attributionControl:true,
 style:{version:8,sources:{carto:{type:'raster',tileSize:256,attribution:'© OpenStreetMap contributors © CARTO · SYKE · Järviwiki (CC BY 4.0)',
  tiles:['https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png','https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png']}},
  layers:[{id:'bg',type:'raster',source:'carto'}]}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
function T(){return S[LANG];}
function fmtVol(v){return v>=1000?(v/1000).toFixed(1)+' km³':v.toFixed(0)+' Mm³';}
function nearest(lon,lat){let b=null,bd=1e9;for(const t of TOWNS){const dx=(t[1]-lon)*Math.cos(lat*Math.PI/180),dy=t[2]-lat;const d=Math.sqrt(dx*dx+dy*dy)*111.32;if(d<bd){bd=d;b=t;}}return b?{name:b[0],km:Math.round(bd)}:null;}
function chart(ser,color,w,h){if(!ser||ser.length<2)return'';w=w||214;h=h||54;const mn=Math.min(...ser),mx=Math.max(...ser),rg=(mx-mn)||1;
 const X=i=>18+(i/(ser.length-1))*(w-22),Y=v=>5+(1-(v-mn)/rg)*(h-16);
 let d='';ser.forEach((v,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '});const lp=[X(ser.length-1),Y(ser[ser.length-1])];
 return '<svg width="'+w+'" height="'+h+'" style="margin:3px 0 0;overflow:visible"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.5"/><circle cx="'+lp[0].toFixed(1)+'" cy="'+lp[1].toFixed(1)+'" r="2.2" fill="'+color+'"/><text x="0" y="9" fill="#69768f" font-size="9">'+(Math.round(mx*10)/10)+'</text><text x="0" y="'+(h-3)+'" fill="#69768f" font-size="9">'+(Math.round(mn*10)/10)+'</text></svg>';}
function block(t,g,lo,hi,n){return '<div class="lgblock"><div class="lt">'+t+'</div><div class="bar" style="background:'+g+'"></div><div class="scale"><span>'+lo+'</span><span>'+hi+'</span></div><div class="lgnote">'+n+'</div></div>';}
function renderLegend(){let h='';const s=T();
 if(vis.level)h+=block(s.legLevel,'linear-gradient(90deg,#d97706,#64748b 50%,#2563eb)',s.loFall,s.hiRise,s.lnLevel);
 if(vis.temp)h+=block(s.legTemp,'linear-gradient(90deg,#2563eb,#14b8a6 40%,#f59e0b 72%,#ef4444)',tmin+'°C',tmax+'°C',s.lnTemp);
 if(vis.ice)h+=block(s.legIce,'linear-gradient(90deg,#f59e0b,#14b8a6 50%,#2563eb)',s.iceEarly,s.iceLate,s.lnIce);
 if(!vis.level&&!vis.temp&&!vis.ice)h='<div class="lgnote">'+s.noSel+'</div>';
 document.getElementById('legend').innerHTML=h;}
function applyLang(){const s=T();document.documentElement.lang=LANG;
 document.getElementById('kick').textContent=s.kick;document.getElementById('sub').innerHTML=s.sub;
 document.getElementById('q').placeholder='🔍  '+s.search;document.getElementById('real').textContent=s.live;
 document.getElementById('lensLab').textContent=s.layers;
 for(const l of['level','temp','ice','lakes']){document.getElementById('nm-'+l).textContent=s[l];document.getElementById('sub-'+l).textContent=s[l+'Sub'];}
 document.querySelectorAll('.lang span').forEach(x=>x.classList.toggle('on',x.dataset.lang===LANG));
 renderLegend();if(lastF)openF(lastF.kind,lastF.p,lastF.c);}
map.on('load',async()=>{
 const gj=await(await fetch('lakes.geojson')).json();LAKES=gj.features;
 map.addSource('lakes',{type:'geojson',data:gj});map.addSource('level',{type:'geojson',data:CFG.level});map.addSource('temp',{type:'geojson',data:CFG.temp});map.addSource('ice',{type:'geojson',data:CFG.ice});
 map.addLayer({id:'lakes',type:'circle',source:'lakes',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,['max',2,['*',['coalesce',['get','r'],1.4],.6]],10,['coalesce',['get','r'],1.4]],'circle-color':'#1e4b7a','circle-opacity':['interpolate',['linear'],['zoom'],4,.5,10,.85],'circle-stroke-width':.3,'circle-stroke-color':'rgba(255,255,255,.5)'}});
 map.addLayer({id:'level',type:'circle',source:'level',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,3.5,10,8],'circle-stroke-width':.8,'circle-stroke-color':'rgba(20,25,40,.55)','circle-color':['interpolate',['linear'],['coalesce',['get','d'],0],-P,'#d97706',0,'#94a3b8',P,'#2563eb']}});
 map.addLayer({id:'temp',type:'circle',source:'temp',layout:{visibility:'none'},paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,4.5,10,10],'circle-stroke-width':.8,'circle-stroke-color':'rgba(20,25,40,.55)','circle-color':['interpolate',['linear'],['get','t'],tmin,'#2563eb',tmid,'#14b8a6',tmax,'#ef4444']}});
 map.addLayer({id:'ice',type:'circle',source:'ice',layout:{visibility:'none'},paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,4.5,10,10],'circle-stroke-width':.8,'circle-stroke-color':'rgba(20,25,40,.55)','circle-color':['interpolate',['linear'],['get','doy'],imin,'#f59e0b',(imin+imax)/2,'#14b8a6',imax,'#2563eb']}});
 ['level','temp','ice','lakes'].forEach(l=>{map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');});
 map.on('click',e=>{const b=6,pt=e.point;const f=map.queryRenderedFeatures([[pt.x-b,pt.y-b],[pt.x+b,pt.y+b]],{layers:['level','temp','ice','lakes']})[0];if(f)openF(f.layer.id,f.properties,f.geometry.coordinates);});
 applyLang();
});
function hidePanel(){document.getElementById('panel').style.display='none';lastF=null;}
function J(x){return typeof x==='string'?JSON.parse(x):x;}
function openF(kind,p,c){lastF={kind,p,c};const s=T();
 document.getElementById('pName').textContent=p.name||p.n||'—';
 document.getElementById('pKunta').textContent=(p.kunta||p.k)?((LANG==='en'?'in ':'')+(p.kunta||p.k)):'';
 let big='';
 if(kind==='level'){big='<div class="big">'+s.mLevel+' <b>'+(p.d>0?'▲ +':p.d<0?'▼ ':'')+(p.d==null?'—':p.d+' cm')+'</b> '+s.in14+'</div>'+chart(J(p.h),'#2563eb')+'<div class="cap">'+p.h0+'–'+p.h1+' · '+s.lvlHist+'</div>';}
 else if(kind==='temp'){const badge=p.m==='a'?'<span class="badge a">'+s.authority+'</span>':'<span class="badge c">'+s.citizen+'</span>';
   big='<div class="big">'+s.mTemp+' <b>'+p.t+' °C</b> · '+(p.date||'')+'</div>'+badge+chart(J(p.h),'#ef4444')+(J(p.h)&&J(p.h).length>1?'<div class="cap">'+p.h0+'–'+p.h1+' · '+s.tHist+'</div>':'');}
 else if(kind==='ice')big='<div class="big">'+s.mIce+' <b>'+p.date.split('-').reverse().join('.')+'</b></div>';
 else if(!('a'in p)&&!('dmax'in p))big='<div class="big" style="color:#96a2ba">'+s.noData+'</div>';
 const cell=(v,l,u)=>(v!=null&&v!=='')?'<div class="c"><div class="v">'+v+' <span style="font-size:10px;color:#8391ad">'+u+'</span></div><div class="l">'+l+'</div></div>':'';
 document.getElementById('pBig').innerHTML=big;
 document.getElementById('pGrid').innerHTML=cell(p.a,s.area,'km²')+cell(p.dmax,s.dmax,'m')+cell(p.dmean,s.dmean,'m')+cell(p.sh,s.sh,'km')+(p.vol!=null?cell(fmtVol(p.vol),s.vol,''):'');
 document.getElementById('pWs').innerHTML=p.ws?(s.ws+': <b>'+p.ws+'</b>'):'';
 const nt=nearest(c[0],c[1]);document.getElementById('pTown').innerHTML=nt?(s.town+': <b>'+nt.km+' km · '+nt.name+'</b>'):'';
 const dir=document.getElementById('pDir'),osm=document.getElementById('pOsm');dir.textContent=s.dir;osm.textContent=s.osm;
 dir.href='https://www.google.com/maps/dir/?api=1&destination='+c[1]+','+c[0];
 osm.href='https://www.openstreetmap.org/?mlat='+c[1]+'&mlon='+c[0]+'#map=12/'+c[1]+'/'+c[0];
 document.getElementById('panel').style.display='block';}
document.querySelectorAll('.lang span').forEach(x=>x.addEventListener('click',()=>{LANG=x.dataset.lang;applyLang();}));
document.querySelectorAll('#lens .opt').forEach(o=>o.addEventListener('click',()=>{const l=o.dataset.l;vis[l]=!vis[l];o.classList.toggle('on',vis[l]);map.setLayoutProperty(l,'visibility',vis[l]?'visible':'none');renderLegend();}));
const q=document.getElementById('q'),res=document.getElementById('res');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();if(v.length<2){res.classList.remove('on');return;}
 const hits=[];for(const f of LAKES){if((f.properties.n||'').toLowerCase().startsWith(v)){hits.push(f);if(hits.length>=80)break;}}
 hits.sort((a,b)=>(b.properties.a||0)-(a.properties.a||0));res._h=hits.slice(0,12);
 res.innerHTML=res._h.map((f,i)=>'<div class="res" data-i="'+i+'">'+f.properties.n+(f.properties.a?' <span class="m">'+f.properties.a+' km²</span>':'')+'<div class="m">'+(f.properties.k||'')+'</div></div>').join('')||'<div class="res">—</div>';
 res.classList.add('on');});
res.addEventListener('click',e=>{const d=e.target.closest('.res');if(!d||d.dataset.i==null)return;const f=res._h[+d.dataset.i];res.classList.remove('on');q.value=f.properties.n;const c=f.geometry.coordinates;map.flyTo({center:c,zoom:10.5,speed:1.5});openF('lakes',f.properties,c);});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.classList.remove('on');});
</script></body></html>
