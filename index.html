<style>
:root{--accent:#0a77ff;--card:#ffffff;--bd:#e5e5e5;--muted:#737373;--faint:#a3a3a3;--ink:#0a0a0a;--subtle:#f5f5f5;--brandtint:#eaf4ff;--success:#228864}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0;background:#f5f5f5}.maplibregl-ctrl-attrib{font-size:10px}
.hud{position:absolute;z-index:5}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 1px 2px rgba(10,10,10,.04),0 4px 14px rgba(10,10,10,.07)}
.title{top:18px;left:18px;padding:14px 16px;max-width:318px}
.kick{font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:500;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,136,100,.14)}
.title h1{margin:6px 0 4px;font-size:20px;font-weight:600;letter-spacing:-.5px}.title h1 b{color:var(--accent);font-weight:600}
.title p{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}.title p b{color:var(--ink);font-weight:600}
.search{top:18px;left:50%;transform:translateX(-50%);width:340px}
.search input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;box-shadow:0 1px 2px rgba(10,10,10,.05);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,119,255,.15)}
.search input::placeholder{color:var(--faint)}
.results{margin-top:6px;border-radius:8px;overflow:hidden;max-height:330px;overflow-y:auto;display:none}
.results.on{display:block}.res{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:14px;color:var(--ink)}
.res:hover{background:var(--subtle)}.res .m{font-size:12px;color:var(--faint)}
.topr{top:18px;right:18px;display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(10,10,10,.05)}
.lang span{padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted)}.lang span.on{background:var(--accent);color:#fafafa}
.real{font-size:10px;font-weight:500;letter-spacing:.04em;background:#eaf8f3;border:1px solid rgba(34,136,100,.3);padding:6px 10px;border-radius:99px;white-space:nowrap;color:var(--success)}
.lens{top:64px;right:18px;padding:8px;width:222px}
.lens .lab{font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:500;padding:4px 6px 6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:3px}
.opt:hover{background:var(--subtle)}.opt.on{border-color:var(--accent);background:var(--brandtint)}
.opt .sw{width:20px;height:20px;border-radius:4px;flex:0 0 auto;opacity:.5}.opt.on .sw{opacity:1}
.opt .nm{font-size:13px;font-weight:500;color:var(--ink)}.opt .sub{font-size:11px;color:var(--faint);margin-top:1px}
.opt .ck{margin-left:auto;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bd);flex:0 0 auto}.opt.on .ck{background:var(--accent);border-color:var(--accent)}
.legend{left:18px;bottom:20px;padding:12px 14px;width:264px}.lgblock{margin-bottom:10px}.lgblock:last-child{margin-bottom:0}
.lt{font-size:12px;color:var(--ink);margin-bottom:7px;font-weight:600}
.bar{height:8px;border-radius:4px;margin-bottom:5px}.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lgnote{margin-top:6px;font-size:11px;color:var(--faint);line-height:1.4}
#panel{right:18px;bottom:20px;width:260px;padding:14px 16px;display:none}
#panel h3{margin:0 0 2px;font-size:16px;font-weight:600}#panel .k{font-size:12px;color:var(--muted);margin-bottom:9px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;margin:0 6px 8px 0;font-weight:500}
.badge.c{background:#eaf8f3;color:var(--success)}.badge.a{background:var(--subtle);color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0;color:#404040}.row .sw2{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.row b{color:var(--ink);font-weight:600}
.town{font-size:12px;color:var(--muted);margin:6px 0 2px}.town b{color:var(--ink);font-weight:600}
.cap{font-size:11px;color:var(--faint);margin-top:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;border-radius:6px;font-size:13px;font-weight:500;font-family:inherit;text-decoration:none;margin-top:7px;cursor:pointer;border:1px solid var(--bd)}
.btn.g{background:var(--accent);color:#fafafa;border-color:var(--accent)}.btn.o{background:var(--card);color:var(--ink)}
#panel .x{position:absolute;top:10px;right:12px;color:var(--faint);cursor:pointer;font-size:16px}
#loader{left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 15px;font-size:12px;color:var(--ink);display:none;align-items:center;gap:9px}
#loader.on{display:flex}.spin{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .title,.real,.maplibregl-ctrl-bottom-right{display:none}
  .search{top:8px;left:8px;right:70px;width:auto;transform:none}.search input{padding:10px 13px;font-size:15px}
  .topr{top:8px;right:8px}
  .lens{top:56px;left:8px;right:8px;width:auto;display:flex;flex-direction:row;gap:6px;overflow-x:auto;padding:6px}
  .lens .lab{display:none}.lens .opt{flex:0 0 auto;margin:0;padding:7px 10px;gap:7px}.lens .opt .sub,.lens .opt .ck{display:none}.lens .opt .nm{white-space:nowrap}
  .legend,#panel{left:8px;right:8px;bottom:10px;width:auto}
}
</style></head><body>
<div id="map"></div>
<div class="hud card title"><div class="kick"><span class="dot"></span> <span id="kick"></span></div><h1>Suomen <b>järvet</b></h1><p id="sub"></p></div>
<div class="hud search"><input id="q" autocomplete="off"><div class="results card" id="res"></div></div>
<div class="hud topr"><div class="lang"><span data-lang="fi" class="on">FI</span><span data-lang="en">EN</span></div><div class="real" id="real"></div></div>
<div class="hud card lens" id="lens"><div class="lab" id="lensLab"></div>
<div class="opt on" data-l="level"><span class="sw" style="background:linear-gradient(90deg,#db6514,#a3a3a3,#0a77ff)"></span><div><div class="nm" id="nm-level"></div><div class="sub" id="sub-level"></div></div><span class="ck"></span></div>
<div class="opt" data-l="temp"><span class="sw" style="background:linear-gradient(90deg,#0a77ff,#d48e29,#c93248)"></span><div><div class="nm" id="nm-temp"></div><div class="sub" id="sub-temp"></div></div><span class="ck"></span></div>
<div class="opt" data-l="ice"><span class="sw" style="background:linear-gradient(90deg,#db6514,#a3a3a3,#0a77ff)"></span><div><div class="nm" id="nm-ice"></div><div class="sub" id="sub-ice"></div></div><span class="ck"></span></div>
<div class="opt on" data-l="lakes"><span class="sw" style="background:#8bbef2"></span><div><div class="nm" id="nm-lakes"></div><div class="sub" id="sub-lakes"></div></div><span class="ck"></span></div></div>
<div class="hud card legend" id="legend"></div>
<div class="hud card" id="loader"><span class="spin"></span><span id="loaderTxt"></span></div>
<div class="hud card" id="zhint" style="left:50%;top:56%;transform:translateX(-50%);padding:9px 15px;font-size:12px;color:var(--ink);display:none"></div>
<div class="hud card" id="panel"><span class="x" onclick="hidePanel()">✕</span>
<h3 id="pName">—</h3><div class="k" id="pKunta"></div><div id="pBody"></div><div class="town" id="pTown"></div>
<a class="btn g" id="pDir" target="_blank" rel="noopener"></a><a class="btn o" id="pOsm" target="_blank" rel="noopener"></a></div>
<script>
const HY='https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.1/odata';
const JW='https://www.jarviwiki.fi/w/api.php', OV='https://overpass-api.de/api/interpreter', NOM='https://nominatim.openstreetmap.org/search';
const OVERPASS_EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'], LAKE_ZOOM=8.5;
const NF=n=>n.toLocaleString('fi-FI');
const S={fi:{kick:'Elävät vedet · Suomi · live',sub:'Suomessa on ~<b>188 000</b> järveä. Data haetaan suoraan selaimeen SYKEltä, Järviwikistä ja OSM:stä. Zoomaa ja klikkaa järveä.',
 search:'Hae järveä — esim. Saimaa, Näsijärvi',live:'● Live: SYKE · Järviwiki · OSM',layers:'Tasot (yhdistele vapaasti)',
 level:'Vedenkorkeus',temp:'Lämpötila',ice:'Jäänlähtö',lakes:'Järvet',
 levelSub:'mittarit · 14 vrk',tempSub:'uimarihavainnot · Järviwiki',iceSub:'kevään jäänlähtö',lakesSub:'oikeat rajat · zoomaa',
 legLevel:'Vedenkorkeus · 14 vrk muutos',legTemp:'Pintaveden lämpötila · viim. 7 vrk',legIce:'Jäänlähtö · kevät',
 loFall:'laskee',hiRise:'nousee',lnLevel:'sininen nousee, oranssi laskee',lnTemp:'uimarien ja viranomaisten mittaamaa',lnIce:'aikaisin → myöhäisin',
 noSel:'Zoomaa sisään niin järvien rajat latautuvat OSM:stä. Klikkaa järveä nähdäksesi sen tiedot.',
 dir:'➜ Reittiohjeet',osm:'Avaa Google Mapsissa',mLevel:'Vedenkorkeus',mTemp:'Pintavesi',mIce:'Jää lähti',in14:'/ 14 vrk',
 town:'lähin taajama',loadT:'Haetaan live-dataa…',loadL:'Haetaan järviä…',zoomHint:'Zoomaa lähemmäs, niin järvien rajat piirtyvät kartalle',citizen:'uimarihavainto',authority:'viranomaisasema',noData:'Ei mittausdataa tälle järvelle.'},
 en:{kick:'Living waters · Finland · live',sub:'Finland has ~<b>188,000</b> lakes. Data is fetched straight to your browser from SYKE, Järviwiki and OSM. Zoom in and click a lake.',
 search:'Search a lake — e.g. Saimaa, Näsijärvi',live:'● Live: SYKE · Järviwiki · OSM',layers:'Layers (mix freely)',
 level:'Water level',temp:'Temperature',ice:'Ice-out',lakes:'Lakes',
 levelSub:'gauges · 14-day',tempSub:'swimmer readings · Järviwiki',iceSub:'spring ice-out',lakesSub:'real outlines · zoom',
 legLevel:'Water level · 14-day change',legTemp:'Surface temperature · last 7 days',legIce:'Ice break-up · spring',
 loFall:'falling',hiRise:'rising',lnLevel:'blue rising, amber falling',lnTemp:'measured by swimmers & authorities',lnIce:'earlier → later',
 noSel:'Zoom in and lake outlines load from OSM. Click a lake to see its data.',
 dir:'➜ Get directions',osm:'Open in Google Maps',mLevel:'Water level',mTemp:'Surface',mIce:'Ice went out',in14:'/ 14 days',
 town:'nearest town',loadT:'Fetching live data…',loadL:'Fetching lakes…',zoomHint:'Zoom in and the lake outlines will appear',citizen:'citizen reading',authority:'authority station',noData:'No measurement data for this lake.'}};
let LANG='fi';const vis={level:true,temp:false,ice:false,lakes:true};let lastF=null;
const FALLBACK=[["Helsinki",24.94,60.17],["Tampere",23.76,61.50],["Oulu",25.47,65.01],["Turku",22.27,60.45],["Jyväskylä",25.75,62.24],["Kuopio",27.68,62.89],["Lahti",25.66,60.98],["Rovaniemi",25.73,66.50],["Vaasa",21.62,63.10],["Joensuu",29.76,62.60],["Mikkeli",27.27,61.69],["Kajaani",27.73,64.22]];
let STN={},TEMP=[],LEVEL=[],ICE=[],TOWNS=FALLBACK,tmin=10,tmax=22,P=15,imin=80,imax=160;

// ---------- helpers ----------
const ymd=d=>new Date(Date.now()-d*864e5).toISOString().slice(0,10);
function dms(s){if(!s)return null;s=(''+s).trim();if(s.includes('.'))return parseFloat(s)||null;if(s.length<5)return null;const v=(+s.slice(0,2))+(+s.slice(2,4))/60+(+s.slice(4,6))/3600;return isFinite(v)?v:null;}
async function jget(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json();}
async function odataAll(path,cap=40000){let rows=[],u=HY+'/'+path;while(u&&rows.length<cap){const d=await jget(u,{headers:{Accept:'application/json'}});rows=rows.concat(d.value||[]);u=d['odata.nextLink']||null;}return rows;}
function kmDist(a,b){const R=6371,dy=(b[1]-a[1])*Math.PI/180,dx=(b[0]-a[0])*Math.PI/180,l1=a[1]*Math.PI/180,l2=b[1]*Math.PI/180;const h=Math.sin(dy/2)**2+Math.cos(l1)*Math.cos(l2)*Math.sin(dx/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function ringsOf(g){if(!g)return[];if(g.type==='Polygon')return g.coordinates;if(g.type==='MultiPolygon')return g.coordinates.flat();return[];}
function pip(pt,rings){let inside=false;for(const ring of rings){for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>pt[1])!=(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))inside=!inside;}}return inside;}
function nearestTown(lon,lat){let b=null,bd=1e9;for(const t of TOWNS){const d=kmDist([lon,lat],[t[1],t[2]]);if(d<bd){bd=d;b=t;}}return b?{name:b[0],km:Math.round(bd)}:null;}
const fc=arr=>({type:'FeatureCollection',features:arr.map(o=>({type:'Feature',geometry:{type:'Point',coordinates:[o.lon,o.lat]},properties:o}))});

// ---------- loaders ----------
async function loadStations(){const rows=await odataAll("Paikka?$select=Paikka_Id,Nimi,JarviNimi,KuntaNimi,KoordLat,KoordLong&$top=6000");for(const s of rows){const la=dms(s.KoordLat),lo=dms(s.KoordLong);if(la&&lo)STN[s.Paikka_Id]={lon:lo,lat:la,name:(s.JarviNimi||s.Nimi||'').trim(),kunta:(s.KuntaNimi||'').trim()};}}
async function loadLevel(){
  const rows=await odataAll("Vedenkorkeus?$filter="+encodeURIComponent("Aika ge datetime'"+ymd(16)+"T00:00:00'")+"&$top=60000");
  const by={};for(const r of rows){const v=parseFloat(r.Arvo);if(isNaN(v))continue;(by[r.Paikka_Id]=by[r.Paikka_Id]||[]).push([r.Aika.slice(0,10),v]);}
  LEVEL=[];for(const id in by){const st=STN[id];if(!st)continue;const pts=by[id].sort((a,b)=>a[0]<b[0]?-1:1);const last=pts[pts.length-1];const tgt=new Date(new Date(last[0])-14*864e5);let ref=pts[0],best=1e9;for(const p of pts){const df=Math.abs(new Date(p[0])-tgt);if(df<best){best=df;ref=p;}}LEVEL.push({lon:st.lon,lat:st.lat,name:st.name,kunta:st.kunta,d:Math.round((last[1]-ref[1])*10)/10,series:pts.map(p=>p[1]),date:last[0],kind:'level'});}
  const a=LEVEL.map(f=>Math.abs(f.d)).filter(x=>x!=null).sort((x,y)=>x-y);P=a.length?Math.max(2,Math.round(a[Math.floor(a.length*0.9)])):15;
}
async function loadTemp(){
  const q="[[ObsCode::temp]][[Pintaveden lämpötila::>0]][[Päivämäärä::>"+ymd(7)+"]]|?Koordinaatit|?Päivämäärä|?Pintaveden lämpötila|?SiteName|?Ylläpito|sort=Päivämäärä|order=descending|limit=5000";
  const d=await jget(JW+"?action=ask&format=json&origin=*&query="+encodeURIComponent(q));const by={};
  for(const k in (d.query&&d.query.results||{})){const po=d.query.results[k].printouts||{};const ko=(po['Koordinaatit']||[])[0],tp=(po['Pintaveden lämpötila']||[])[0],dt=(po['Päivämäärä']||[])[0];if(!ko||!tp||!dt)continue;const site=((po['SiteName']||[])[0]||{}).fulltext||k;const mt=(po['Ylläpito']||[])[0]||'';(by[site]=by[site]||[]).push({ts:+dt.timestamp,t:parseFloat(tp.value),lon:+ko.lon,lat:+ko.lat,mt});}
  TEMP=[];for(const site in by){const arr=by[site].sort((a,b)=>a.ts-b.ts);const l=arr[arr.length-1];if(!(l.lon&&l.lat))continue;TEMP.push({lon:l.lon,lat:l.lat,name:(site.split(' (')[0]||site).trim(),t:Math.round(l.t*10)/10,date:new Date(l.ts*1000).toLocaleDateString('fi-FI'),m:/iranomais/i.test(l.mt)?'a':'c',series:arr.map(x=>x.t),kind:'temp'});}
  const tv=TEMP.map(f=>f.t);if(tv.length){tmin=Math.round(Math.min(...tv));tmax=Math.round(Math.max(...tv));}
}
async function loadIce(){
  const y=new Date().getFullYear();
  const rows=await odataAll("JaatJaanlahto?$filter="+encodeURIComponent("Arvo ge datetime'"+y+"-03-01T00:00:00' and Arvo le datetime'"+y+"-06-30T00:00:00'")+"&$top=3000");
  const by={};for(const r of rows){const dd=r.Arvo.slice(0,10);by[r.Paikka_Id]=(by[r.Paikka_Id]&&by[r.Paikka_Id]>dd)?by[r.Paikka_Id]:dd;}
  ICE=[];for(const id in by){const st=STN[id];if(!st)continue;const doy=Math.round((new Date(by[id])-new Date(new Date(by[id]).getFullYear(),0,0))/864e5);ICE.push({lon:st.lon,lat:st.lat,name:st.name,date:by[id],doy,kind:'ice'});}
  const dd=ICE.map(f=>f.doy);if(dd.length){imin=Math.min(...dd);imax=Math.max(...dd);}
}
async function loadTowns(){try{const q='[out:json][timeout:60];area["ISO3166-1"="FI"][admin_level=2]->.fi;(node["place"~"^(city|town)$"](area.fi););out qt;';const d=await jget(OV,{method:'POST',body:'data='+encodeURIComponent(q)});const t=(d.elements||[]).filter(e=>e.tags&&(e.tags['name:fi']||e.tags.name)&&e.lon).map(e=>[e.tags['name:fi']||e.tags.name,e.lon,e.lat]);if(t.length>50)TOWNS=t;}catch(e){}}

// ---------- map ----------
const map=new maplibregl.Map({container:'map',center:[25.7,64.4],zoom:4.55,attributionControl:true,
 style:{version:8,sources:{carto:{type:'raster',tileSize:256,attribution:'© OpenStreetMap contributors © CARTO · SYKE · Järviwiki (CC BY 4.0)',tiles:['https://a.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png','https://c.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png']}},layers:[{id:'bg',type:'raster',source:'carto'}]}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
const T=()=>S[LANG];
function loader(on,txt){const l=document.getElementById('loader');document.getElementById('loaderTxt').textContent=txt||'';l.classList.toggle('on',on);}
function updateHint(){const z=document.getElementById('zhint');if(!z)return;const show=vis.lakes&&map.getZoom()<LAKE_ZOOM;z.textContent=show?T().zoomHint:'';z.style.display=show?'block':'none';}
function block(t,g,lo,hi,n){return '<div class="lgblock"><div class="lt">'+t+'</div><div class="bar" style="background:'+g+'"></div><div class="scale"><span>'+lo+'</span><span>'+hi+'</span></div><div class="lgnote">'+n+'</div></div>';}
function renderLegend(){let h='';const s=T();
 if(vis.level)h+=block(s.legLevel,'linear-gradient(90deg,#db6514,#a3a3a3 50%,#0a77ff)','−'+P+' cm ('+s.loFall+')','+'+P+' cm ('+s.hiRise+')',s.lnLevel);
 if(vis.temp)h+=block(s.legTemp,'linear-gradient(90deg,#0a77ff,#d48e29 55%,#c93248)',tmin+'°C',tmax+'°C',s.lnTemp);
 if(vis.ice)h+=block(s.legIce,'linear-gradient(90deg,#db6514,#a3a3a3 50%,#0a77ff)',s.loFall==='laskee'?'aikaisin':'earlier',s.loFall==='laskee'?'myöhäisin':'later',s.lnIce);
 if(!vis.level&&!vis.temp&&!vis.ice)h='<div class="lgnote">'+s.noSel+'</div>';
 document.getElementById('legend').innerHTML=h;}
function applyLang(){const s=T();document.documentElement.lang=LANG;
 document.getElementById('kick').textContent=s.kick;document.getElementById('sub').innerHTML=s.sub;
 document.getElementById('q').placeholder='🔍  '+s.search;document.getElementById('real').textContent=s.live;document.getElementById('lensLab').textContent=s.layers;
 for(const l of['level','temp','ice','lakes']){document.getElementById('nm-'+l).textContent=s[l];document.getElementById('sub-'+l).textContent=s[l+'Sub'];}
 document.querySelectorAll('.lang span').forEach(x=>x.classList.toggle('on',x.dataset.lang===LANG));
 renderLegend();updateHint();if(lastF)openF(lastF);}
function spark(ser,color){if(!ser||ser.length<2)return'';const w=210,h=40,mn=Math.min(...ser),mx=Math.max(...ser),rg=(mx-mn)||1,X=i=>18+i/(ser.length-1)*(w-22),Y=v=>5+(1-(v-mn)/rg)*(h-16);let d='';ser.forEach((v,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');return '<svg width="'+w+'" height="'+h+'" style="margin:3px 0"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.5"/><text x="0" y="9" fill="#a3a3a3" font-size="9">'+(Math.round(mx*10)/10)+'</text><text x="0" y="'+(h-3)+'" fill="#a3a3a3" font-size="9">'+(Math.round(mn*10)/10)+'</text></svg>';}

map.on('load',async()=>{
 map.addSource('lakes',{type:'geojson',data:fc([])});map.addSource('level',{type:'geojson',data:fc([])});map.addSource('temp',{type:'geojson',data:fc([])});map.addSource('ice',{type:'geojson',data:fc([])});
 map.addLayer({id:'lakes-fill',type:'fill',source:'lakes',paint:{'fill-color':'#bcdcff','fill-opacity':0.5}});
 map.addLayer({id:'lakes-line',type:'line',source:'lakes',paint:{'line-color':'#4a94f0','line-width':1}});
 map.addLayer({id:'level',type:'circle',source:'level',paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,3.5,10,7],'circle-stroke-width':.8,'circle-stroke-color':'rgba(10,10,10,.35)','circle-color':['interpolate',['linear'],['coalesce',['get','d'],0],-P,'#db6514',0,'#a3a3a3',P,'#0a77ff']}});
 map.addLayer({id:'temp',type:'circle',source:'temp',layout:{visibility:'none'},paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,4.5,10,9],'circle-stroke-width':.8,'circle-stroke-color':'rgba(10,10,10,.35)','circle-color':['interpolate',['linear'],['get','t'],tmin,'#0a77ff',(tmin+tmax)/2,'#d48e29',tmax,'#c93248']}});
 map.addLayer({id:'ice',type:'circle',source:'ice',layout:{visibility:'none'},paint:{'circle-radius':['interpolate',['linear'],['zoom'],4,4.5,10,9],'circle-stroke-width':.8,'circle-stroke-color':'rgba(10,10,10,.35)','circle-color':['interpolate',['linear'],['get','doy'],imin,'#db6514',(imin+imax)/2,'#a3a3a3',imax,'#0a77ff']}});
 applyLang();
 // fetch live data
 loader(true,T().loadT);
 loadTemp().then(()=>{map.getSource('temp').setData(fc(TEMP));}).catch(e=>console.warn('temp',e));
 loadStations().then(()=>Promise.allSettled([loadLevel(),loadIce()])).then(()=>{
   map.getSource('level').setData(fc(LEVEL));map.getSource('ice').setData(fc(ICE));
   map.setPaintProperty('temp','circle-color',['interpolate',['linear'],['get','t'],tmin,'#2563eb',(tmin+tmax)/2,'#14b8a6',tmax,'#ef4444']);
   map.setPaintProperty('level','circle-color',['interpolate',['linear'],['coalesce',['get','d'],0],-P,'#d97706',0,'#94a3b8',P,'#2563eb']);
   map.setPaintProperty('ice','circle-color',['interpolate',['linear'],['get','doy'],imin,'#f59e0b',(imin+imax)/2,'#14b8a6',imax,'#2563eb']);
   renderLegend();loader(false);
 }).catch(e=>{console.warn(e);loader(false);});
 loadTowns();
 // hover + click
 ['level','temp','ice','lakes-fill'].forEach(l=>{map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');});
 map.on('click',e=>{const b=6,pt=e.point;const f=map.queryRenderedFeatures([[pt.x-b,pt.y-b],[pt.x+b,pt.y+b]],{layers:['level','temp','ice','lakes-fill']});
   const lake=f.find(x=>x.layer.id==='lakes-fill');if(lake){openLake(lake,[e.lngLat.lng,e.lngLat.lat]);return;}const m=f[0];if(m)openF(m.properties);});
 map.on('moveend',()=>{clearTimeout(window._lt);window._lt=setTimeout(loadLakes,450);});
 map.on('zoom',updateHint); updateHint();
});

// ---------- OSM lakes (viewport) ----------
let LAKEF=[],lakeKey='';
async function overpass(q){
 for(const ep of OVERPASS_EPS){
   const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),14000);
   try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal});clearTimeout(t);if(r.ok)return await r.json();}
   catch(e){clearTimeout(t);}
 }
 return null;
}
async function loadLakes(){
 updateHint();
 if(!vis.lakes||map.getZoom()<LAKE_ZOOM){if(map.getSource('lakes'))map.getSource('lakes').setData(fc([]));LAKEF=[];return;}
 const b=map.getBounds();const bbox=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(3)).join(',');
 if(bbox===lakeKey)return;lakeKey=bbox;loader(true,T().loadL);
 const q='[out:json][timeout:20];(way["natural"="water"]["name"]('+bbox+');relation["natural"="water"]["name"]('+bbox+'););out geom;';
 const d=await overpass(q);
 if(d){const g=osmtogeojson(d);LAKEF=(g.features||[]).filter(f=>f.geometry&&/Polygon/.test(f.geometry.type)&&f.properties&&f.properties.name);map.getSource('lakes').setData({type:'FeatureCollection',features:LAKEF});}
 else{lakeKey='';}  // fetch failed on all endpoints — keep prior lakes, allow retry on next move
 loader(false);
}

// ---------- panel ----------
function hidePanel(){document.getElementById('panel').style.display='none';lastF=null;}
function setBtns(lon,lat){const s=T();const dir=document.getElementById('pDir'),osm=document.getElementById('pOsm');dir.textContent=s.dir;osm.textContent=s.osm;dir.href='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lon;osm.href='https://www.google.com/maps/search/?api=1&query='+lat+','+lon;}
function rowHtml(sw,label,val){return '<div class="row"><span class="sw2" style="background:'+sw+'"></span>'+label+' <b>'+val+'</b></div>';}
function openF(p){lastF={single:p};const s=T();document.getElementById('pName').textContent=p.name||'—';document.getElementById('pKunta').textContent=p.kunta?((LANG==='en'?'in ':'')+p.kunta):'';
 let h='';if(p.kind==='level')h=rowHtml('#0a77ff',s.mLevel,(p.d>0?'▲ +':p.d<0?'▼ ':'')+(p.d==null?'—':p.d+' cm')+' '+s.in14)+spark(p.series,'#0a77ff');
 else if(p.kind==='temp')h='<span class="badge '+(p.m||'c')+'">'+(p.m==='a'?s.authority:s.citizen)+'</span>'+rowHtml('#db6514',s.mTemp,p.t+' °C · '+p.date)+spark(p.series,'#db6514');
 else if(p.kind==='ice')h=rowHtml('#0a77ff',s.mIce,(''+p.date).split('-').reverse().join('.'));
 document.getElementById('pBody').innerHTML=h;
 const nt=nearestTown(p.lon,p.lat);document.getElementById('pTown').innerHTML=nt?(s.town+': <b>'+nt.km+' km · '+nt.name+'</b>'):'';
 setBtns(p.lon,p.lat);document.getElementById('panel').style.display='block';}
function openLake(feat,ll){const s=T();const g=feat.geometry;const full=LAKEF.find(f=>f.id===feat.id)||feat;const rings=ringsOf(full.geometry);
 const name=feat.properties.name;lastF={lake:feat,ll};
 document.getElementById('pName').textContent=name;
 // consolidate: measurements inside this lake polygon
 const inT=TEMP.filter(m=>pip([m.lon,m.lat],rings)),inL=LEVEL.filter(m=>pip([m.lon,m.lat],rings)),inI=ICE.filter(m=>pip([m.lon,m.lat],rings));
 let h='';
 if(inT.length){const t=inT.sort((a,b)=>b.t-a.t)[0];h+='<span class="badge '+(t.m||'c')+'">'+(t.m==='a'?s.authority:s.citizen)+'</span>'+rowHtml('#db6514',s.mTemp,t.t+' °C · '+t.date);}
 if(inL.length){const l=inL[0];h+=rowHtml('#0a77ff',s.mLevel,(l.d>0?'▲ +':l.d<0?'▼ ':'')+(l.d==null?'—':l.d+' cm')+' '+s.in14);}
 if(inI.length){h+=rowHtml('#0a77ff',s.mIce,(''+inI[0].date).split('-').reverse().join('.'));}
 const tags=feat.properties;if(tags.depth||tags['max_depth'])h+=rowHtml('#737373',(LANG==='fi'?'syvyys':'depth'),(tags['max_depth']||tags.depth)+' m');
 if(!h)h='<div class="cap" style="margin:4px 0 2px">'+s.noData+'</div>';
 document.getElementById('pBody').innerHTML=h;
 document.getElementById('pKunta').textContent='';
 const nt=nearestTown(ll[0],ll[1]);document.getElementById('pTown').innerHTML=nt?(s.town+': <b>'+nt.km+' km · '+nt.name+'</b>'):'';
 setBtns(ll[0],ll[1]);document.getElementById('panel').style.display='block';}

// ---------- lens + lang ----------
document.querySelectorAll('.lang span').forEach(x=>x.addEventListener('click',()=>{LANG=x.dataset.lang;applyLang();}));
document.querySelectorAll('#lens .opt').forEach(o=>o.addEventListener('click',()=>{const l=o.dataset.l;vis[l]=!vis[l];o.classList.toggle('on',vis[l]);
 if(l==='lakes'){['lakes-fill','lakes-line'].forEach(id=>map.setLayoutProperty(id,'visibility',vis.lakes?'visible':'none'));if(vis.lakes){lakeKey='';loadLakes();}}
 else map.setLayoutProperty(l,'visibility',vis[l]?'visible':'none');renderLegend();updateHint();}));

// ---------- search (Nominatim) ----------
const q=document.getElementById('q'),res=document.getElementById('res');let stimer;
q.addEventListener('input',()=>{clearTimeout(stimer);const v=q.value.trim();if(v.length<3){res.classList.remove('on');return;}stimer=setTimeout(async()=>{
 try{const d=await jget(NOM+'?format=jsonv2&countrycodes=fi&limit=8&q='+encodeURIComponent(v),{headers:{Accept:'application/json'}});
   const hits=d.filter(x=>/water|lake|bay|river|stream|wetland/i.test((x.type||'')+(x.category||''))||/järvi|lampi|vesi|selkä/i.test(x.display_name)).slice(0,8);
   res._h=hits.length?hits:d.slice(0,6);
   res.innerHTML=res._h.map((f,i)=>'<div class="res" data-i="'+i+'">'+(f.name||f.display_name.split(',')[0])+'<div class="m">'+f.display_name.split(',').slice(1,3).join(', ')+'</div></div>').join('')||'<div class="res">—</div>';
   res.classList.add('on');}catch(e){}
},350);});
res.addEventListener('click',e=>{const d=e.target.closest('.res');if(!d||d.dataset.i==null)return;const f=res._h[+d.dataset.i];res.classList.remove('on');q.value=f.name||f.display_name.split(',')[0];map.flyTo({center:[+f.lon,+f.lat],zoom:11,speed:1.5});});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.classList.remove('on');});
</script></body></html>
